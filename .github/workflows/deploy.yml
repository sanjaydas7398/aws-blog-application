name: Deploy Blog App to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get AWS Account ID
        id: get-account-id
        run: echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        env:
          ACCOUNT_ID: ${{ steps.get-account-id.outputs.account_id }}
        run: |
          docker build -t $ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/blog-backend:latest ./backend
          docker push $ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/blog-backend:latest

      - name: Build and push frontend image
        env:
          ACCOUNT_ID: ${{ steps.get-account-id.outputs.account_id }}
        run: |
          docker build -t $ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/blog-frontend:latest ./frontend
          docker push $ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/blog-frontend:latest

      - name: Deploy backend to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            docker pull $ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/blog-backend:latest
            docker stop blog-backend || true
            docker rm blog-backend || true
            docker run -d --name blog-backend -p 5000:5000 -v backend_data:/app/data -e NODE_ENV=production -e PORT=5000 $ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/blog-backend:latest

      - name: Deploy frontend to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            docker pull $ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/blog-frontend:latest
            docker stop blog-frontend || true
            docker rm blog-frontend || true
            docker run -d --name blog-frontend -p 80:80 $ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/blog-frontend:latest
