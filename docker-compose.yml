version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: 512902042782.dkr.ecr.ap-south-1.amazonaws.com/blog-backend:latest
    container_name: blog-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - backend_data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=5000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: 512902042782.dkr.ecr.ap-south-1.amazonaws.com/blog-frontend:latest  # ✅ Correct indent
    container_name: blog-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend_data:
